<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F59E0B">
<title>EINKAFFEE — Administración</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;min-height:100vh;color:#1a1a1a}
.app{max-width:680px;margin:0 auto;padding:1.25rem 1rem 4rem}
h1,h2,h3{font-weight:500}
input,select,button{font-family:inherit}
input[type=number],input[type=date],input[type=text],input[type=password],input[type=month],input[type=datetime-local],select{width:100%;padding:8px 10px;border:0.5px solid #ddd;border-radius:8px;font-size:14px;color:#1a1a1a;outline:none;background:#fff}
input:focus,select:focus{border-color:#aaa}
.card{background:#fff;border:0.5px solid #e5e5e5;border-radius:16px;padding:16px 18px;margin-bottom:14px}
.metric{border-radius:14px;padding:12px 14px;flex:1;min-width:0}
.metric .ml{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.metric .mv{font-size:17px;font-weight:500}
.metric .ms{font-size:11px;color:#888;margin-top:3px}
.metrics{display:flex;gap:8px;margin-bottom:12px}
.bar-track{flex:1;height:6px;background:#e5e5e5;border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width .4s}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.pill{font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;display:inline-block}
.lbl{font-size:11px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:5px}
.btn{padding:10px;border:none;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;color:#fff}
.btn-outline{background:transparent;border:0.5px solid #ddd;color:#555;border-radius:10px;padding:8px 16px;font-size:13px;cursor:pointer}
.tab-btn{padding:7px 12px;font-size:12px;white-space:nowrap;border-radius:99px;cursor:pointer;border:0.5px solid #ddd;background:transparent;color:#888}
.tab-btn.active{background:#F59E0B;color:#fff;border-color:#F59E0B;font-weight:500}
.sub-btn{padding:6px 14px;font-size:12px;border-radius:99px;cursor:pointer;border:0.5px solid #ddd;background:transparent;color:#888;white-space:nowrap;text-transform:capitalize}
.sub-btn.active{background:#3B82F6;color:#fff;border-color:#3B82F6;font-weight:500}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200}
.modal-box{background:#fff;border-radius:20px;padding:1.5rem;width:340px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.modal-box h3{font-size:16px;font-weight:500;margin-bottom:14px;color:#1a1a1a}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:.5px solid #f0f0f0}
.list-row:last-child{border-bottom:none}
.del-btn{font-size:12px;padding:2px 8px;border:.5px solid #fca5a5;border-radius:6px;background:transparent;color:#EF4444;cursor:pointer}
.status{font-size:10px;font-weight:500}
.emp-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0}
.checkin-btn{padding:13px 24px;font-size:14px;font-weight:500;cursor:pointer;border:none;border-radius:14px;color:#fff}
.tabs-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:20px}
.turno-btn{flex:1;padding:8px 0;font-size:12px;font-weight:500;border:none;border-radius:10px;cursor:pointer;position:relative}
.medio-box{border-radius:12px;padding:10px 12px}
.medio-box .ml2{font-size:11px;font-weight:500;margin-bottom:5px}
.medio-box input{background:transparent;border:none;border-radius:0;padding:2px 0;font-size:16px;font-weight:500;width:100%;outline:none}
.bar-balance{margin-bottom:10px}
.bar-balance .bl{display:flex;justify-content:space-between;margin-bottom:4px;font-size:12px}
.bar-balance .bt{height:7px;background:#e5e5e5;border-radius:99px;overflow:hidden}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
@media print{.no-print{display:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div style="text-align:center;padding:2rem">
    <div style="font-size:36px">☕</div>
    <p style="color:#F59E0B;font-size:20px;font-weight:700;letter-spacing:.15em;margin:8px 0 4px">EINKAFFEE</p>
    <p style="color:#888;font-size:12px">Conectando...</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, deleteDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const FB = {
  apiKey:"AIzaSyA0Ulhpz4X2X823w_C16duwMt6asinJPeI",
  authDomain:"cafe-cumbrecita.firebaseapp.com",
  projectId:"cafe-cumbrecita",
  storageBucket:"cafe-cumbrecita.firebasestorage.app",
  messagingSenderId:"268620258519",
  appId:"1:268620258519:web:25cf01ff874cc3a55fe492"
};
const app = initializeApp(FB);
const db = getFirestore(app);

// ── CONSTANTES ────────────────────────────────────────────────────────────────
const PROVEEDORES=["Aceite de oliva","Café","Cantón de las Sierras","Cordiez","Centeno","Chucrut","Don Ramón","Dulces","Especias","Fabeda","Frigorífico Nvo. Munich","Frutos Rojos","Frutos Secos","Helados","Hai","Hongos","Luconi","Maní","Nachos","Pasta","Pollo","Rancho Grande","Saan","Tulum","Verduleria Depósito","Verduleria Punto Verde","Santaolalla","Salsas El Taller","Cerveza BergBräu","Cerveza Wildermann","Saltetto","Vifood","Limonadas","Agua","Alfajores","Baguettes","Budines","Maria Pastelería","Odasso","Panificación de La Villa","Croissant","Scons","Tortas Jorge"];  // lista inicial para importar
// Rol administrativo (trabajo remoto): pedidos, recepción de mercadería y pagos a proveedores
const ADM_DEFAULT={nombre:"Victoria",rol:"Asistente administrativa (remoto)",inicio:"2026-12-01",finPrueba:"2027-03-31",estado:"prueba",pin:"",pinDueno:"1234",honorarioMensual:0,accesoActivo:true,notasEvaluacion:"",montoLimiteAprobacion:100000};
const ADM_ESTADOS={prueba:"Período de prueba",efectiva:"Efectiva",finalizada:"Finalizada"};
const ADM_ESTADO_COLOR={prueba:"#F59E0B",efectiva:"#10B981",finalizada:"#6B7280"};
const UNIDADES=["u","kg","g","l","cajas","bultos","docenas","paquetes"];
const PEDIDO_ESTADO={pendiente_aprobacion:"Esperando aprobación",pendiente_envio:"Para enviar",enviado:"Enviado",pendiente:"Enviado",recibido:"Recibido",cancelado:"Cancelado"};
const PEDIDO_COLOR={pendiente_aprobacion:"#EC4899",pendiente_envio:"#F59E0B",enviado:"#3B82F6",pendiente:"#3B82F6",recibido:"#10B981",cancelado:"#6B7280"};
const PAGO_ESTADO={pendiente_aprobacion:"Esperando aprobación",programado:"Programado",ejecutado:"Pagado"};
const PAGO_COLOR={pendiente_aprobacion:"#EC4899",programado:"#3B82F6",ejecutado:"#10B981"};
const MEDIOS_PROV=["Efectivo","Transferencia Galicia","Mercado Pago","Cheque","Tarjeta"];
const CONDICIONES={"Contado":0,"7 días":7,"15 días":15,"30 días":30};
const DIAS_SEM=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const RUBROS=["Café","Panificados","Pastelería","Lácteos","Verdulería","Carnes","Almacén","Bebidas","Vinos","Cerveza","Helados","Especias","Insumos de cocina","Packaging y descartables","Limpieza","Otros proveedores"];

// ── HELPERS ───────────────────────────────────────────────────────────────────
const fmt=n=>Number(n||0).toLocaleString("es-AR",{minimumFractionDigits:0,maximumFractionDigits:0});
const fmtD=n=>Number(n||0).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const moneda=n=>"$"+Math.round(n||0).toLocaleString("es-AR");
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;};
const thisMonth=()=>today().slice(0,7);
const pill=(txt,color,bg)=>`<span class="pill" style="background:${bg||color+'22'};color:${color}">${txt}</span>`;

// ── STATE ─────────────────────────────────────────────────────────────────────
let STATE={
  modo:"login", pinInput:"", pinError:false, connOk:false, cfgCargada:false,
  admCfg:{...ADM_DEFAULT}, pedidos:[], pagosProv:[], bitacora:[], proveedores:[],
  admSubTab:"hoy", admCfgEdit:null, admCfgMsg:"",
  admPed:null, admRecep:null, admPago:null, admLog:null, admProv:null,
};

const R=()=>render(document.getElementById("app"));

// ── FIREBASE ──────────────────────────────────────────────────────────────────
// Los pagos hechos también se guardan en "gastos" para no perder el registro contable
const saveGasto=async(id,data)=>setDoc(doc(db,"gastos",String(id)),{...data});
const delGasto=async id=>deleteDoc(doc(db,"gastos",String(id)));
const saveAdmCfg=async data=>setDoc(doc(db,"config","administrativa"),{...data,updatedAt:new Date().toISOString()});
const saveProveedor=async(id,data)=>setDoc(doc(db,"proveedores",String(id)),{...data});
const savePedido=async(id,data)=>setDoc(doc(db,"pedidos",String(id)),{...data});
const delPedido=async id=>deleteDoc(doc(db,"pedidos",String(id)));
const savePagoProv=async(id,data)=>setDoc(doc(db,"pagosProv",String(id)),{...data});
const delPagoProv=async id=>deleteDoc(doc(db,"pagosProv",String(id)));
const saveBitacora=async(id,data)=>setDoc(doc(db,"bitacora",String(id)),{...data});
const delBitacora=async id=>deleteDoc(doc(db,"bitacora",String(id)));

const porFechaDesc=campo=>(a,b)=>(a[campo]||"")<(b[campo]||"")?1:-1;
const escuchar=(col,key,campo)=>onSnapshot(collection(db,col),snap=>{
  STATE[key]=[];snap.forEach(s=>STATE[key].push({id:s.id,...s.data()}));
  if(campo)STATE[key].sort(porFechaDesc(campo));
  STATE.connOk=true;R();
},()=>{STATE.connOk=false;R();});
onSnapshot(doc(db,"config","administrativa"),s=>{STATE.admCfg={...ADM_DEFAULT,...(s.exists()?s.data():{})};STATE.cfgCargada=true;STATE.connOk=true;R();},()=>{STATE.connOk=false;R();});
escuchar("proveedores","proveedores");
escuchar("pedidos","pedidos","fechaPedido");
escuchar("pagosProv","pagosProv","fecha");
escuchar("bitacora","bitacora","fecha");

// ── LOGIN ─────────────────────────────────────────────────────────────────────
const entrar=()=>{
  const c=STATE.admCfg,pin=STATE.pinInput;
  if(pin&&pin===(c.pinDueno||"1234")){STATE.modo="admin";STATE.pinError=false;}
  else if(c.pin&&pin===c.pin&&c.accesoActivo&&c.estado!=="finalizada"){STATE.modo="administrativa";STATE.pinError=false;}
  else STATE.pinError=true;
  STATE.pinInput="";STATE.admSubTab="hoy";R();
};
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-action]");if(!t)return;
  if(t.dataset.action==="do-login")entrar();
  else if(t.dataset.action==="logout"){STATE.modo="login";STATE.admPed=STATE.admRecep=STATE.admPago=STATE.admLog=STATE.admProv=STATE.admCfgEdit=null;R();}
});
document.addEventListener("input",e=>{if(e.target.dataset.bind==="pinInput")STATE.pinInput=e.target.value;});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset.bind==="pinInput"){STATE.pinInput=e.target.value;entrar();}});

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(el){
  el.innerHTML=STATE.modo==="login"?renderLogin():`${header()}${renderAdministrativa(esDueno())}`;
  if(STATE.modo==="login")document.querySelector("[data-bind=pinInput]")?.focus();
}

const header=()=>`
<div style="text-align:center;margin-bottom:20px;position:relative">
  <div style="font-size:36px;margin-bottom:4px">☕</div>
  <p style="font-size:22px;font-weight:700;color:#F59E0B;text-transform:uppercase;letter-spacing:.15em;margin:0 0 4px">EINKAFFEE</p>
  <p style="font-size:12px;color:#888;margin:0;letter-spacing:.05em">Administración — ${esDueno()?"Santi":esc(STATE.admCfg.nombre)}</p>
  <button data-action="logout" class="btn-outline no-print" style="position:absolute;top:0;right:0;font-size:12px;padding:6px 12px;border-radius:8px">Salir</button>
  <span class="status" style="display:block;margin-top:6px;color:${STATE.connOk?"#10B981":"#EF4444"}">● ${STATE.connOk?"Conectado":"Sin conexión"}</span>
</div>`;

function renderLogin(){
  return `<div style="min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:2rem">
    <div style="font-size:40px">☕</div>
    <p style="font-size:22px;font-weight:700;color:#F59E0B;letter-spacing:.15em;text-transform:uppercase;margin:0">EINKAFFEE</p>
    <p style="font-size:13px;color:#888;margin:0">Administración · La Cumbrecita</p>
    <input type="password" inputmode="numeric" placeholder="PIN" data-bind="pinInput" value=""
      style="text-align:center;font-size:28px;letter-spacing:12px;width:180px;padding:12px;border:2px solid ${STATE.pinError?"#EF4444":"#ddd"};border-radius:14px;outline:none">
    ${STATE.pinError?`<p style="font-size:13px;color:#EF4444;margin:0">PIN incorrecto</p>`:""}
    <button data-action="do-login" class="btn" style="background:#F59E0B;padding:10px 32px;font-size:14px;border-radius:12px" ${STATE.cfgCargada?"":"disabled"}>${STATE.cfgCargada?"Entrar":"Conectando..."}</button>
    <span class="status" style="color:${STATE.connOk?"#10B981":"#EF4444"}">● ${STATE.connOk?"Conectado":"Sin conexión"}</span>
  </div>`;
}

function metricCard(label,value,color,sub=""){
  return `<div class="metric" style="background:${color}14">
    <div class="ml" style="color:${color}">${label}</div>
    <div class="mv">${value}</div>
    ${sub?`<div class="ms">${sub}</div>`:""}
  </div>`;
}

// ── ADMINISTRATIVA (rol remoto: pedidos, recepción, facturas, pagos) ─────────
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const diasEntre=(a,b)=>Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000);
const sumarDias=(f,n)=>{const d=new Date(f+"T00:00:00");d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;};
const diaHoy=()=>["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"][new Date().getDay()];
const esDueno=()=>STATE.modo==="admin";
const quienSoy=()=>STATE.modo==="administrativa"?(STATE.admCfg.nombre||"Administrativa"):"Admin";
const limiteAprob=()=>Number(STATE.admCfg.montoLimiteAprobacion)||0;
const provByName=n=>STATE.proveedores.find(p=>p.nombre===n);
const provNombres=()=>{const act=STATE.proveedores.filter(p=>p.activo!==false).map(p=>p.nombre).sort((a,b)=>a.localeCompare(b));return act.length?act:PROVEEDORES;};
const pedidoTotal=items=>(items||[]).reduce((s,it)=>s+(Number(it.cantidad)||0)*(Number(it.precio)||0),0);
const pedidoTotalFactura=p=>p.recepcion?Number(p.recepcion.montoFactura)||0:0;
const pagoEjecutado=x=>!x.estado||x.estado==="ejecutado";
const pagadoPedido=id=>STATE.pagosProv.filter(x=>x.pedidoId===id&&pagoEjecutado(x)).reduce((s,x)=>s+(Number(x.monto)||0),0);
const programadoPedido=id=>STATE.pagosProv.filter(x=>x.pedidoId===id&&x.estado==="programado").reduce((s,x)=>s+(Number(x.monto)||0),0);
const esEnviado=p=>p.estado==="enviado"||p.estado==="pendiente";
const facturasPendientes=()=>STATE.pedidos.filter(p=>p.estado==="recibido"&&pedidoTotalFactura(p)-pagadoPedido(p.id)>0)
  .map(p=>({...p,debe:pedidoTotalFactura(p)-pagadoPedido(p.id),venc:p.recepcion?.vencimiento||p.recepcion?.fecha||""}))
  .sort((a,b)=>a.venc<b.venc?-1:1);
const saldosProveedores=()=>{
  const m={};
  STATE.pedidos.filter(p=>p.estado==="recibido").forEach(p=>{m[p.proveedor]=m[p.proveedor]||{facturado:0,pagado:0};m[p.proveedor].facturado+=pedidoTotalFactura(p);});
  STATE.pagosProv.filter(pagoEjecutado).forEach(x=>{m[x.proveedor]=m[x.proveedor]||{facturado:0,pagado:0};m[x.proveedor].pagado+=Number(x.monto)||0;});
  return Object.entries(m).map(([proveedor,v])=>({proveedor,...v,saldo:v.facturado-v.pagado})).sort((a,b)=>b.saldo-a.saldo);
};
const vencColor=f=>!f?"#888":f<today()?"#EF4444":f<=sumarDias(today(),7)?"#F59E0B":"#888";
const nuevoItem=()=>({producto:"",cantidad:"",unidad:"u",precio:""});
const nuevoPedido=prov=>({proveedor:prov||"",fechaPedido:today(),fechaEntrega:"",notas:"",items:[nuevoItem()]});
const nuevoPago=p=>({fecha:today(),proveedor:p?.proveedor||"",pedidoId:p?.id||"",monto:p?String(Math.max(0,pedidoTotalFactura(p)-pagadoPedido(p.id))||""):"",medioPago:(p&&provByName(p.proveedor)?.medioPagoHabitual)||"Transferencia Galicia",cuando:"ahora",fechaProgramada:p?.recepcion?.vencimiento||today(),comprobante:"",nota:""});
const nuevoLog=()=>({fecha:today(),horas:"",tareas:""});
const nuevoProv=()=>({nombre:"",rubro:"Almacén",contacto:"",whatsapp:"",email:"",diasPedido:[],horaCorte:"",pedidoMinimo:"",condicionPago:"Contado",medioPagoHabitual:"Transferencia Galicia",alias:"",notas:"",activo:true});
const mensajeWhatsApp=p=>`Hola! Pedido de Einkaffee (La Cumbrecita)${p.fechaEntrega?` para el ${p.fechaEntrega}`:""}:\n${(p.items||[]).map(it=>`• ${it.cantidad} ${it.unidad} ${it.producto}`).join("\n")}${p.notas?`\n${p.notas}`:""}\nGracias! ${STATE.admCfg.nombre||""}`;
const linkWhatsApp=(p,prov)=>`https://wa.me/${String(prov?.whatsapp||"").replace(/\D/g,"")}?text=${encodeURIComponent(mensajeWhatsApp(p))}`;

const periodoInfo=()=>{
  const c=STATE.admCfg,hoy=today();
  if(c.estado==="finalizada")return{txt:"Colaboración finalizada",color:"#6B7280"};
  if(c.estado==="efectiva")return{txt:`Efectiva desde ${c.efectivaDesde||"—"}`,color:"#10B981"};
  if(hoy<c.inicio)return{txt:`Comienza el ${c.inicio} (faltan ${diasEntre(hoy,c.inicio)} días)`,color:"#3B82F6"};
  if(hoy<=c.finPrueba){const tot=diasEntre(c.inicio,c.finPrueba),pas=diasEntre(c.inicio,hoy);return{txt:`Prueba: día ${pas+1} de ${tot+1} — quedan ${tot-pas} días (evaluación ${c.finPrueba})`,color:"#F59E0B",pct:Math.round(pas/tot*100)};}
  return{txt:`Prueba terminada el ${c.finPrueba} — falta decidir si queda efectiva`,color:"#EF4444",pct:100};
};

function renderAdministrativa(dueno){
  const SUBS=[["hoy","🏠 Hoy"],["pedidos","📦 Pedidos"],["recepcion","🚚 Recepción"],["facturas","🧾 Facturas"],["pagos","💳 Pagos"],["proveedores","🏪 Proveedores"],["bitacora","🗒 Bitácora"],...(dueno?[["rol","👤 Rol"]]:[])];
  if(!SUBS.some(([k])=>k===STATE.admSubTab))STATE.admSubTab="hoy";
  const pi=periodoInfo(),c=STATE.admCfg;
  const views={hoy:renderAdmHoy,pedidos:renderAdmPedidos,recepcion:renderAdmRecepcion,facturas:renderAdmFacturas,pagos:renderAdmPagos,proveedores:renderAdmProveedores,bitacora:renderAdmBitacora,rol:renderAdmRol};
  return `<div class="card" style="border-left:3px solid ${pi.color}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
      <div><p style="font-size:14px;font-weight:500;margin:0">${esc(c.nombre)} ${pill(ADM_ESTADOS[c.estado]||c.estado,ADM_ESTADO_COLOR[c.estado]||"#888")}</p>
      <p style="font-size:12px;color:#888;margin:2px 0 0">${esc(c.rol)}</p></div>
      <span style="font-size:12px;color:${pi.color};font-weight:500">${pi.txt}</span>
    </div>
    ${pi.pct!=null?`<div class="bar-track" style="margin-top:10px"><div class="bar-fill" style="width:${pi.pct}%;background:${pi.color}"></div></div>`:""}
  </div>
  <div class="tabs-scroll no-print" style="margin-bottom:14px">
    ${SUBS.map(([k,l])=>`<button data-action="adm-sub" data-val="${k}" class="sub-btn ${STATE.admSubTab===k?"active":""}">${l}</button>`).join("")}
  </div>
  ${views[STATE.admSubTab]()}
  ${renderAdmModals()}`;
}

const seccion=(titulo,items,vacio)=>`<div class="card"><p style="font-size:13px;font-weight:500;margin:0 0 10px">${titulo}</p>${items.length?items.join(""):`<p style="font-size:12px;color:#aaa;margin:0">${vacio}</p>`}</div>`;
const miniBtn=(action,val,txt,color="#3B82F6")=>`<button data-action="${action}" data-val="${esc(val)}" class="btn" style="background:${color};padding:5px 10px;font-size:11px;border-radius:8px">${txt}</button>`;
const fila=(izq,der)=>`<div class="list-row" style="gap:8px"><div style="min-width:0">${izq}</div><div style="display:flex;gap:6px;flex-shrink:0;align-items:center">${der}</div></div>`;

function renderAdmHoy(){
  const hoy=today(),dia=diaHoy();
  const pedidoHoy=n=>STATE.pedidos.some(p=>p.proveedor===n&&p.fechaPedido===hoy&&p.estado!=="cancelado");
  const tocaPedir=STATE.proveedores.filter(p=>p.activo!==false&&(p.diasPedido||[]).includes(dia)).sort((a,b)=>(a.horaCorte||"99")<(b.horaCorte||"99")?-1:1);
  const aprobPed=STATE.pedidos.filter(p=>p.estado==="pendiente_aprobacion");
  const aprobPag=STATE.pagosProv.filter(x=>x.estado==="pendiente_aprobacion");
  const paraEnviar=STATE.pedidos.filter(p=>p.estado==="pendiente_envio");
  const atrasados=STATE.pedidos.filter(p=>esEnviado(p)&&p.fechaEntrega&&p.fechaEntrega<hoy);
  const llegaHoy=STATE.pedidos.filter(p=>esEnviado(p)&&p.fechaEntrega===hoy);
  const facts=facturasPendientes().filter(f=>f.venc<=sumarDias(hoy,7));
  const pagosHoy=STATE.pagosProv.filter(x=>x.estado==="programado"&&(x.fechaProgramada||"")<=hoy);
  const aprob=[
    ...aprobPed.map(p=>fila(`<span style="font-size:13px;font-weight:500">Pedido ${esc(p.proveedor)}</span><p style="font-size:11px;color:#888;margin:0">${moneda(p.totalEstimado)} · por ${esc(p.creadoPor)}</p>`,
      esDueno()?miniBtn("adm-ped-aprobar",p.id,"Aprobar","#10B981")+miniBtn("adm-ped-rechazar",p.id,"Rechazar","#EF4444"):pill("Esperando OK","#F59E0B"))),
    ...aprobPag.map(x=>fila(`<span style="font-size:13px;font-weight:500">Pago ${esc(x.proveedor)}</span><p style="font-size:11px;color:#888;margin:0">${moneda(x.monto)} · ${esc(x.medioPago)} · por ${esc(x.creadoPor)}</p>`,
      esDueno()?miniBtn("adm-pago-aprobar",x.id,"Aprobar","#10B981")+miniBtn("adm-pago-rechazar",x.id,"Rechazar","#EF4444"):pill("Esperando OK","#F59E0B"))),
  ];
  return `<div class="metrics">
    ${metricCard("Para pedir hoy",tocaPedir.filter(p=>!pedidoHoy(p.nombre)).length,"#3B82F6",dia)}
    ${metricCard("Atrasados",atrasados.length,"#EF4444")}
    ${metricCard("Vence ≤7 días",moneda(facts.reduce((s,f)=>s+f.debe,0)),"#F59E0B",facts.length+" facturas")}
  </div>
  ${aprob.length?seccion(esDueno()?"✅ Para aprobar":"⏳ Esperando aprobación",aprob,""):""}
  ${seccion(`🛒 Toca pedir hoy (${dia})`,tocaPedir.map(p=>fila(
    `<span style="font-size:13px;font-weight:500">${esc(p.nombre)}</span><p style="font-size:11px;color:#888;margin:0">${p.horaCorte?`Corte ${esc(p.horaCorte)} · `:""}${p.pedidoMinimo?`Mínimo ${moneda(p.pedidoMinimo)} · `:""}${esc(p.rubro||"")}</p>`,
    pedidoHoy(p.nombre)?pill("Hecho","#10B981"):miniBtn("adm-ped-new",p.nombre,"Armar pedido"))),
    STATE.proveedores.length?"Ningún proveedor tiene hoy como día de pedido.":"Cargá los días de pedido en 🏪 Proveedores.")}
  ${paraEnviar.length?seccion("📲 Para enviar",paraEnviar.map(p=>fila(`<span style="font-size:13px;font-weight:500">${esc(p.proveedor)}</span><p style="font-size:11px;color:#888;margin:0">${(p.items||[]).length} ítems · ${moneda(p.totalEstimado)}</p>`,botonEnviar(p))),""):""}
  ${atrasados.length||llegaHoy.length?seccion("🚚 Entregas",[...atrasados.map(p=>fila(`<span style="font-size:13px;font-weight:500">${esc(p.proveedor)}</span> ${pill("Atrasado","#EF4444")}<p style="font-size:11px;color:#888;margin:0">Esperado ${p.fechaEntrega}</p>`,miniBtn("adm-recep-open",p.id,"Recibir","#10B981"))),...llegaHoy.map(p=>fila(`<span style="font-size:13px;font-weight:500">${esc(p.proveedor)}</span> ${pill("Llega hoy","#3B82F6")}`,miniBtn("adm-recep-open",p.id,"Recibir","#10B981")))],""):""}
  ${facts.length?seccion("🧾 Facturas vencidas / por vencer",facts.map(f=>fila(`<span style="font-size:13px;font-weight:500">${esc(f.proveedor)}</span><p style="font-size:11px;margin:0;color:${vencColor(f.venc)}">Vence ${f.venc||"—"} · debe ${moneda(f.debe)}</p>`,miniBtn("adm-pago-pedido",f.id,"Pagar","#10B981"))),""):""}
  ${pagosHoy.length?seccion("💳 Pagos programados para hoy",pagosHoy.map(x=>fila(`<span style="font-size:13px;font-weight:500">${esc(x.proveedor)}</span><p style="font-size:11px;color:#888;margin:0">${moneda(x.monto)} · ${esc(x.medioPago)} · ${x.fechaProgramada}</p>`,miniBtn("adm-pago-ejecutar",x.id,"Marcar pagado","#10B981"))),""):""}`;
}

function botonEnviar(p){
  const prov=provByName(p.proveedor);
  return prov?.whatsapp?`<a href="${linkWhatsApp(p,prov)}" target="_blank" rel="noopener" data-action="adm-ped-enviado" data-val="${p.id}" class="btn" style="background:#25D366;padding:5px 10px;font-size:11px;border-radius:8px;text-decoration:none">📲 WhatsApp</a>`
    :miniBtn("adm-ped-enviado",p.id,"Marcar enviado");
}

function provSelect(bind,val){
  const ops=provNombres();
  return `<select data-bind="${bind}"><option value="">— Seleccioná —</option>${ops.map(p=>`<option ${val===p?"selected":""}>${esc(p)}</option>`).join("")}${val&&!ops.includes(val)?`<option selected>${esc(val)}</option>`:""}</select>`;
}

function renderAdmPedidos(){
  const f=STATE.admPed;
  let form=`<button data-action="adm-ped-new" data-val="" class="btn" style="width:100%;background:#3B82F6;margin-bottom:14px">+ Nuevo pedido</button>`;
  if(f){
    const prov=provByName(f.proveedor),total=pedidoTotal(f.items),lim=limiteAprob();
    const ultimo=f.proveedor&&!f.id?STATE.pedidos.find(p=>p.proveedor===f.proveedor&&p.estado!=="cancelado"):null;
    form=`<div class="card">
    <p style="font-size:13px;font-weight:500;margin:0 0 14px">${f.id?"Editar":"Nuevo"} pedido</p>
    <div style="margin-bottom:10px"><label class="lbl">Proveedor</label>${provSelect("admPed.proveedor",f.proveedor)}</div>
    ${prov?`<p style="font-size:11px;color:#888;margin:-4px 0 10px">${[(prov.diasPedido||[]).length?"Pide: "+prov.diasPedido.join(", "):"",prov.horaCorte?"corte "+prov.horaCorte:"",prov.pedidoMinimo?"mínimo "+moneda(prov.pedidoMinimo):"",prov.condicionPago].filter(Boolean).map(esc).join(" · ")}</p>`:""}
    ${ultimo?`<button data-action="adm-ped-copiar" data-val="${ultimo.id}" class="btn-outline" style="width:100%;margin-bottom:10px">↺ Copiar último pedido (${ultimo.fechaPedido})</button>`:""}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
      <div><label class="lbl">Fecha pedido</label><input type="date" data-bind="admPed.fechaPedido" value="${f.fechaPedido}"></div>
      <div><label class="lbl">Entrega estimada</label><input type="date" data-bind="admPed.fechaEntrega" value="${f.fechaEntrega}"></div>
    </div>
    <label class="lbl">Productos (precio unitario estimado opcional)</label>
    ${f.items.map((it,i)=>`<div style="display:grid;grid-template-columns:1fr 58px 74px 74px 26px;gap:5px;margin-bottom:6px">
      <input type="text" data-bind="admItem.${i}.producto" value="${esc(it.producto)}" placeholder="Producto">
      <input type="number" data-bind="admItem.${i}.cantidad" value="${esc(it.cantidad)}" placeholder="Cant.">
      <select data-bind="admItem.${i}.unidad">${UNIDADES.map(u=>`<option ${it.unidad===u?"selected":""}>${u}</option>`).join("")}</select>
      <input type="number" data-bind="admItem.${i}.precio" value="${esc(it.precio)}" placeholder="$ unit.">
      <button data-action="adm-ped-del-item" data-val="${i}" class="del-btn">×</button>
    </div>`).join("")}
    <button data-action="adm-ped-add-item" class="btn-outline" style="width:100%;margin-bottom:10px">+ Agregar producto</button>
    <div style="margin-bottom:10px"><label class="lbl">Notas para el proveedor</label><input type="text" data-bind="admPed.notas" value="${esc(f.notas)}" placeholder="Ej: entregar antes de las 10"></div>
    <p id="adm-ped-total" style="font-size:12px;margin:0 0 12px;color:#555">${renderPedTotalTxt(f)}</p>
    <div style="display:flex;gap:8px">
      <button data-action="adm-ped-cancel" class="btn-outline" style="flex:1">Cancelar</button>
      <button data-action="adm-ped-save" class="btn" style="flex:2;background:#3B82F6">Guardar pedido</button>
    </div>
  </div>`;
  }
  const lista=STATE.pedidos.slice(0,40);
  return `${form}
  ${seccion("Pedidos",lista.map(p=>{
    const acciones=[];
    if(p.estado==="pendiente_aprobacion"&&esDueno())acciones.push(miniBtn("adm-ped-aprobar",p.id,"Aprobar","#10B981"));
    if(p.estado==="pendiente_envio")acciones.push(botonEnviar(p));
    if(esEnviado(p))acciones.push(miniBtn("adm-recep-open",p.id,"Recibir","#10B981"));
    if(!["recibido","cancelado"].includes(p.estado))acciones.push(`<button data-action="adm-ped-edit" data-val="${p.id}" class="btn-outline" style="padding:3px 8px;font-size:11px">Editar</button><button data-action="adm-ped-cancelar" data-val="${p.id}" class="del-btn">Anular</button>`);
    if(p.estado==="cancelado")acciones.push(`<button data-action="adm-ped-del" data-val="${p.id}" class="del-btn">×</button>`);
    return fila(`<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span style="font-size:13px;font-weight:500">${esc(p.proveedor)}</span>${pill(PEDIDO_ESTADO[p.estado]||p.estado,PEDIDO_COLOR[p.estado]||"#888")}${esEnviado(p)&&p.fechaEntrega&&p.fechaEntrega<today()?pill("Atrasado","#EF4444"):""}</div>
      <p style="font-size:12px;color:#555;margin:2px 0">${(p.items||[]).map(it=>`${esc(it.cantidad)} ${esc(it.unidad)} ${esc(it.producto)}`).join(" · ")}</p>
      <span style="font-size:11px;color:#aaa">${p.fechaPedido||""}${p.fechaEntrega?` → ${p.fechaEntrega}`:""}${p.totalEstimado?` · ${moneda(p.totalEstimado)}`:""} · por ${esc(p.creadoPor||"")}</span>`,acciones.join(""));
  }),"Todavía no hay pedidos.")}`;
}
function renderPedTotalTxt(f){
  const prov=provByName(f.proveedor),total=pedidoTotal(f.items),lim=limiteAprob();
  return [`Total estimado: <b>${moneda(total)}</b>`,
    prov?.pedidoMinimo&&total&&total<prov.pedidoMinimo?`<span style="color:#EF4444">no llega al mínimo (${moneda(prov.pedidoMinimo)})</span>`:"",
    !esDueno()&&lim&&total>lim?`<span style="color:#F59E0B">supera ${moneda(lim)}: queda esperando aprobación de Santi</span>`:""].filter(Boolean).join(" · ");
}

function renderAdmRecepcion(){
  const pend=STATE.pedidos.filter(esEnviado).sort((a,b)=>(a.fechaEntrega||"9")<(b.fechaEntrega||"9")?-1:1);
  const rec=STATE.pedidos.filter(p=>p.estado==="recibido").sort((a,b)=>(a.recepcion?.fecha||"")<(b.recepcion?.fecha||"")?1:-1).slice(0,20);
  return `<div class="card"><p style="font-size:13px;font-weight:500;margin:0 0 4px">Pendientes de recibir</p>
    <p style="font-size:11px;color:#888;margin:0 0 10px">Desde el local te mandan la foto del remito o factura por WhatsApp; cargala acá y marcá si llegó todo bien.</p>
    ${pend.length?pend.map(p=>fila(`<span style="font-size:13px;font-weight:500">${esc(p.proveedor)}</span>
      <p style="font-size:11px;margin:0;color:${p.fechaEntrega&&p.fechaEntrega<today()?"#EF4444":"#888"}">${(p.items||[]).length} ítems · entrega ${p.fechaEntrega||"s/f"}</p>`,miniBtn("adm-recep-open",p.id,"Registrar recepción","#10B981"))).join(""):`<p style="font-size:12px;color:#aaa">No hay pedidos enviados esperando entrega.</p>`}
  </div>
  ${seccion("Últimas recepciones",rec.map(p=>{const r=p.recepcion||{};return fila(`<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span style="font-size:13px;font-weight:500">${esc(p.proveedor)}</span>${r.conforme?pill("Conforme","#10B981"):pill("Con diferencias","#EF4444")}</div>
      <span style="font-size:11px;color:#aaa">${r.fecha||""} · recibió ${esc(r.recibio||"—")} · ${esc(r.tipo||"")} ${esc(r.nroRemito||"")}</span>
      ${r.obs?`<p style="font-size:11px;color:#EF4444;margin:2px 0 0">${esc(r.obs)}</p>`:""}`,`<span style="font-size:13px;font-weight:500">$${fmt(r.montoFactura)}</span>`);}),"Todavía no hay recepciones.")}`;
}

function renderAdmFacturas(){
  const fp=facturasPendientes(),s=saldosProveedores();
  return `<div class="metrics">
    ${metricCard("Deuda total",moneda(fp.reduce((a,f)=>a+f.debe,0)),"#EF4444",fp.length+" facturas")}
    ${metricCard("Vencidas",moneda(fp.filter(f=>f.venc&&f.venc<today()).reduce((a,f)=>a+f.debe,0)),"#F59E0B")}
  </div>
  ${seccion("Facturas pendientes de pago",fp.map(f=>{const prog=programadoPedido(f.id);return fila(`<span style="font-size:13px;font-weight:500">${esc(f.proveedor)}</span> <span style="font-size:11px;color:#aaa">${esc(f.recepcion?.tipo||"")} ${esc(f.recepcion?.nroRemito||"")}</span>
    <p style="font-size:11px;margin:0;color:${vencColor(f.venc)}">Vence ${f.venc||"—"}${prog?` · programado ${moneda(prog)}`:""}</p>`,`<span style="font-size:13px;font-weight:500">${moneda(f.debe)}</span>${miniBtn("adm-pago-pedido",f.id,"Pagar","#10B981")}`);}),"No hay facturas pendientes 🎉")}
  ${seccion("Cuenta corriente por proveedor",s.map(x=>fila(`<span style="font-size:13px;font-weight:500">${esc(x.proveedor)}</span>
      <p style="font-size:11px;color:#888;margin:0">Facturado $${fmt(x.facturado)} · Pagado $${fmt(x.pagado)}</p>`,
      `<span style="font-size:13px;font-weight:500;color:${x.saldo>0?"#EF4444":x.saldo<0?"#3B82F6":"#10B981"}">${x.saldo>0?"Debe $"+fmt(x.saldo):x.saldo<0?"A favor $"+fmt(-x.saldo):"Al día"}</span>`)),"Todavía no hay movimientos.")}`;
}

function renderAdmPagos(){
  const f=STATE.admPago;
  let form=`<button data-action="adm-pago-new" class="btn" style="width:100%;background:#10B981;margin-bottom:14px">+ Registrar pago</button>`;
  if(f){
    const facts=facturasPendientes().filter(p=>p.proveedor===f.proveedor);
    const lim=limiteAprob(),monto=parseFloat(f.monto)||0;
    form=`<div class="card">
    <p style="font-size:13px;font-weight:500;margin:0 0 4px">Pago a proveedor</p>
    <p style="font-size:11px;color:#888;margin:0 0 12px">Al marcarlo pagado se carga solo como gasto "Proveedores" en el Balance.</p>
    <div style="margin-bottom:10px"><label class="lbl">Proveedor</label>${provSelect("admPago.proveedor",f.proveedor)}</div>
    ${f.proveedor?`<div style="margin-bottom:10px"><label class="lbl">Factura</label><select data-bind="admPago.pedidoId"><option value="">— Pago a cuenta —</option>${facts.map(p=>`<option value="${p.id}" ${f.pedidoId===p.id?"selected":""}>${esc(p.recepcion?.nroRemito||"s/n")} · vence ${p.venc} · debe $${fmt(p.debe)}</option>`).join("")}</select></div>`:""}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
      <div><label class="lbl">Monto ($)</label><input type="number" data-bind="admPago.monto" value="${esc(f.monto)}" placeholder="0"></div>
      <div><label class="lbl">Medio</label><select data-bind="admPago.medioPago">${MEDIOS_PROV.map(m=>`<option ${f.medioPago===m?"selected":""}>${m}</option>`).join("")}</select></div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:10px">${[["ahora","Pagado hoy"],["programar","Programar"]].map(([k,l])=>`<button data-action="adm-pago-cuando" data-val="${k}" style="flex:1;padding:7px 0;font-size:12px;cursor:pointer;border-radius:10px;border:1.5px solid ${f.cuando===k?"#10B981":"#e5e5e5"};background:${f.cuando===k?"#ECFDF5":"#fafafa"};color:${f.cuando===k?"#059669":"#888"}">${l}</button>`).join("")}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
      ${f.cuando==="programar"?`<div><label class="lbl">Fecha a pagar</label><input type="date" data-bind="admPago.fechaProgramada" value="${f.fechaProgramada}"></div>`:`<div><label class="lbl">Fecha</label><input type="date" data-bind="admPago.fecha" value="${f.fecha}"></div>`}
      <div><label class="lbl">${f.medioPago==="Cheque"?"Nº cheque":"Nº comprobante"}</label><input type="text" data-bind="admPago.comprobante" value="${esc(f.comprobante)}"></div>
    </div>
    <div style="margin-bottom:10px"><label class="lbl">Nota</label><input type="text" data-bind="admPago.nota" value="${esc(f.nota)}"></div>
    ${!esDueno()&&lim&&monto>lim?`<p style="font-size:12px;color:#F59E0B;margin:0 0 10px">Supera ${moneda(lim)}: queda esperando aprobación de Santi.</p>`:""}
    <div style="display:flex;gap:8px">
      <button data-action="adm-pago-cancel" class="btn-outline" style="flex:1">Cancelar</button>
      <button data-action="adm-pago-save" class="btn" style="flex:2;background:#10B981">Guardar</button>
    </div>
  </div>`;
  }
  const mes=STATE.pagosProv.filter(x=>pagoEjecutado(x)&&(x.fecha||"").startsWith(thisMonth()));
  const prog=STATE.pagosProv.filter(x=>x.estado==="programado");
  return `<div class="metrics">
    ${metricCard("Pagado este mes",moneda(mes.reduce((s,x)=>s+(Number(x.monto)||0),0)),"#10B981",mes.length+" pagos")}
    ${metricCard("Programado",moneda(prog.reduce((s,x)=>s+(Number(x.monto)||0),0)),"#3B82F6",prog.length+" pagos")}
  </div>
  ${form}
  ${seccion("Pagos",STATE.pagosProv.slice(0,40).map(x=>{
    const est=x.estado||"ejecutado",acc=[];
    if(est==="pendiente_aprobacion"&&esDueno())acc.push(miniBtn("adm-pago-aprobar",x.id,"Aprobar","#10B981"));
    if(est==="programado")acc.push(miniBtn("adm-pago-ejecutar",x.id,"Marcar pagado","#10B981"));
    acc.push(`<button data-action="adm-pago-del" data-val="${x.id}" class="del-btn">×</button>`);
    return fila(`<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span style="font-size:13px;font-weight:500">${esc(x.proveedor)}</span>${pill(PAGO_ESTADO[est],PAGO_COLOR[est])}${pill(x.medioPago,"#6B7280")}</div>
      <span style="font-size:11px;color:#aaa">${est==="ejecutado"?x.fecha:"para "+(x.fechaProgramada||"")} · ${moneda(x.monto)} · ${esc(x.comprobante||"s/comprobante")} · por ${esc(x.creadoPor||"")}</span>`,acc.join(""));
  }),"Todavía no hay pagos.")}`;
}

  const f=STATE.admProv;
  let form=`<button data-action="adm-prov-new" class="btn" style="width:100%;background:#3B82F6;margin-bottom:14px">+ Nuevo proveedor</button>`;
  if(f)form=`<div class="card">
    <p style="font-size:13px;font-weight:500;margin:0 0 14px">${f.id?"Editar":"Nuevo"} proveedor</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
      <div><label class="lbl">Nombre</label><input type="text" data-bind="admProv.nombre" value="${esc(f.nombre)}"></div>
      <div><label class="lbl">Rubro</label><select data-bind="admProv.rubro">${RUBROS.map(r=>`<option ${f.rubro===r?"selected":""}>${r}</option>`).join("")}</select></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
      <div><label class="lbl">Contacto</label><input type="text" data-bind="admProv.contacto" value="${esc(f.contacto)}"></div>
      <div><label class="lbl">WhatsApp</label><input type="text" data-bind="admProv.whatsapp" value="${esc(f.whatsapp)}" placeholder="549351..."></div>
    </div>
    <label class="lbl">Días de pedido</label>

      <div><label class="lbl">Fin de prueba</label><input type="date" data-bind="admCfgEdit.finPrueba" value="${c.finPrueba}"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
      <div><label class="lbl">PIN de ${esc(c.nombre||"ella")}</label><input type="text" inputmode="numeric" data-bind="admCfgEdit.pin" value="${esc(c.pin)}" placeholder="4-8 dígitos"></div>

// Pago efectivamente hecho: se refleja como gasto "Proveedores" en el Balance
const registrarGastoPago=async x=>{
  const gastoId="g"+x.id;
  await saveGasto(gastoId,{id:gastoId,fecha:x.fecha,categoria:"Proveedores",proveedor:x.proveedor,descripcion:`Pago proveedor${x.comprobante?" · "+x.comprobante:""}${x.nota?" · "+x.nota:""}`,monto:Number(x.monto)||0,tipo:"Variable",medioPago:x.medioPago,empleadoId:"",origen:"administrativa",pagoId:x.id});
  return gastoId;
};

document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-action^='adm-']");if(!t)return;
  const a=t.dataset.action,v=t.dataset.val;
  if(a==="adm-sub"){STATE.admSubTab=v;if(v==="rol"){STATE.admCfgEdit={...STATE.admCfg};STATE.admCfgMsg="";}}
  // pedidos
  else if(a==="adm-ped-new"){STATE.admPed=nuevoPedido(v);STATE.admSubTab="pedidos";}
  else if(a==="adm-ped-cancel")STATE.admPed=null;
  else if(a==="adm-ped-add-item")STATE.admPed.items.push(nuevoItem());
  else if(a==="adm-ped-del-item"){STATE.admPed.items.splice(Number(v),1);if(!STATE.admPed.items.length)STATE.admPed.items.push(nuevoItem());}
  else if(a==="adm-ped-copiar"){const p=STATE.pedidos.find(x=>x.id===v);if(p)STATE.admPed.items=(p.items||[]).map(it=>({producto:it.producto,cantidad:it.cantidad,unidad:it.unidad,precio:it.precio||""}));}
  else if(a==="adm-ped-edit"){STATE.admPed=JSON.parse(JSON.stringify(STATE.pedidos.find(x=>x.id===v)));STATE.admPed.items=STATE.admPed.items.map(it=>({precio:"",...it}));}
  else if(a==="adm-ped-save"){
    const f=STATE.admPed,items=f.items.filter(it=>it.producto.trim());
    if(!f.proveedor||!items.length)return;
    const id=f.id||String(Date.now()),total=pedidoTotal(items),lim=limiteAprob();
    let estado=f.estado&&f.estado!=="pendiente_aprobacion"?f.estado:"pendiente_envio";
    if(!esDueno()&&lim&&total>lim)estado="pendiente_aprobacion";
    await savePedido(id,{...f,id,items,totalEstimado:total,estado,creadoPor:f.creadoPor||quienSoy(),creadoEn:f.creadoEn||new Date().toISOString()});
    STATE.admPed=null;
  }
  else if(a==="adm-ped-aprobar"){if(!esDueno())return;const p=STATE.pedidos.find(x=>x.id===v);if(p)await savePedido(v,{...p,estado:"pendiente_envio",aprobadoPor:"Admin",aprobadoEn:new Date().toISOString()});}
  else if(a==="adm-ped-rechazar"){if(!esDueno())return;const p=STATE.pedidos.find(x=>x.id===v);if(p&&confirm("¿Rechazar y anular este pedido?"))await savePedido(v,{...p,estado:"cancelado"});}
  else if(a==="adm-ped-enviado"){const p=STATE.pedidos.find(x=>x.id===v);if(p)await savePedido(v,{...p,estado:"enviado",enviadoEn:new Date().toISOString(),enviadoPor:quienSoy()});}
  else if(a==="adm-ped-cancelar"){const p=STATE.pedidos.find(x=>x.id===v);if(p&&confirm("¿Anular este pedido?"))await savePedido(v,{...p,estado:"cancelado"});}
  else if(a==="adm-ped-del"){if(confirm("¿Eliminar el pedido anulado?"))await delPedido(v);}
  // recepción
  else if(a==="adm-recep-open"){
    const p=STATE.pedidos.find(x=>x.id===v),prov=provByName(p.proveedor);
    STATE.admRecep={pedidoId:v,fecha:today(),tipo:"Remito",nroRemito:"",recibio:"",montoFactura:p.totalEstimado?String(p.totalEstimado):"",vencimiento:sumarDias(today(),CONDICIONES[prov?.condicionPago]||0),obs:"",recibidos:(p.items||[]).map(it=>it.cantidad)};
  }
  else if(a==="adm-recep-close")STATE.admRecep=null;
  else if(a==="adm-recep-save"){
    const r=STATE.admRecep,p=STATE.pedidos.find(x=>x.id===r.pedidoId);
    const items=(p.items||[]).map((it,i)=>({...it,recibido:r.recibidos[i]}));
    const conforme=!r.obs.trim()&&items.every(it=>Number(it.recibido)===Number(it.cantidad));
    await savePedido(p.id,{...p,items,estado:"recibido",recepcion:{fecha:r.fecha,tipo:r.tipo,nroRemito:r.nroRemito,recibio:r.recibio,montoFactura:Number(r.montoFactura)||0,vencimiento:r.vencimiento,obs:r.obs,conforme,cargadoPor:quienSoy()}});
    STATE.admRecep=null;
  }
  // pagos
  else if(a==="adm-pago-new")STATE.admPago=nuevoPago();
  else if(a==="adm-pago-pedido"){STATE.admSubTab="pagos";STATE.admPago=nuevoPago(STATE.pedidos.find(x=>x.id===v));}
  else if(a==="adm-pago-cancel")STATE.admPago=null;
  else if(a==="adm-pago-cuando")STATE.admPago.cuando=v;
  else if(a==="adm-pago-save"){
    const f=STATE.admPago,monto=parseFloat(f.monto)||0,lim=limiteAprob();
    if(!f.proveedor||!monto)return;
    const id=String(Date.now());
    let estado=f.cuando==="programar"?"programado":"ejecutado";
    if(!esDueno()&&lim&&monto>lim)estado="pendiente_aprobacion";
    const x={...f,id,monto,estado,creadoPor:quienSoy()};
    if(estado==="ejecutado")x.gastoId=await registrarGastoPago(x);
    await savePagoProv(id,x);
    STATE.admPago=null;
  }
  else if(a==="adm-pago-aprobar"){
    if(!esDueno())return;
    const x=STATE.pagosProv.find(p=>p.id===v);if(!x)return;
    const ahora=x.cuando!=="programar";
    const upd={...x,estado:ahora?"ejecutado":"programado",aprobadoPor:"Admin",aprobadoEn:new Date().toISOString()};
    if(ahora){upd.fecha=today();upd.gastoId=await registrarGastoPago(upd);}
    await savePagoProv(v,upd);
  }
  else if(a==="adm-pago-rechazar"){if(!esDueno())return;if(confirm("¿Rechazar este pago?"))await delPagoProv(v);}
  else if(a==="adm-pago-ejecutar"){
    const x=STATE.pagosProv.find(p=>p.id===v);if(!x)return;
    const upd={...x,estado:"ejecutado",fecha:today(),ejecutadoPor:quienSoy()};
    upd.gastoId=await registrarGastoPago(upd);
    await savePagoProv(v,upd);
  }
  else if(a==="adm-pago-del"){
    const x=STATE.pagosProv.find(p=>p.id===v);if(!x||!confirm("¿Eliminar el pago?"+(x.gastoId?" También se borra el gasto asociado.":"")))return;
    if(x.gastoId)await delGasto(x.gastoId);
    await delPagoProv(v);
  }
  // proveedores
  else if(a==="adm-prov-new")STATE.admProv=nuevoProv();
  else if(a==="adm-prov-edit")STATE.admProv={...nuevoProv(),...JSON.parse(JSON.stringify(STATE.proveedores.find(x=>x.id===v)))};
  else if(a==="adm-prov-cancel")STATE.admProv=null;
  else if(a==="adm-prov-dia"){const d=STATE.admProv.diasPedido||[];STATE.admProv.diasPedido=d.includes(v)?d.filter(x=>x!==v):DIAS_SEM.filter(x=>d.includes(x)||x===v);}
  else if(a==="adm-prov-save"){
    const f=STATE.admProv;if(!f.nombre.trim())return;
    const id=f.id||"p"+Date.now();
    await saveProveedor(id,{...f,id,nombre:f.nombre.trim(),pedidoMinimo:Number(f.pedidoMinimo)||0});
    STATE.admProv=null;
  }
  else if(a==="adm-prov-importar"){
    if(STATE.proveedores.length)return;
    await Promise.all(PROVEEDORES.map((n,i)=>saveProveedor("p"+(i+1),{...nuevoProv(),id:"p"+(i+1),nombre:n,rubro:"Otros proveedores",pedidoMinimo:0})));
  }
  // bitácora
  else if(a==="adm-log-new")STATE.admLog=nuevoLog();
  else if(a==="adm-log-cancel")STATE.admLog=null;
  else if(a==="adm-log-save"){
    const f=STATE.admLog;if(!f.tareas.trim()&&!Number(f.horas))return;
    const id=String(Date.now());
    await saveBitacora(id,{...f,id,horas:Number(f.horas)||0,creadoPor:quienSoy()});
    STATE.admLog=null;
  }
  else if(a==="adm-log-del"){if(confirm("¿Eliminar registro?"))await delBitacora(v);}
  // rol (solo dueño)
  else if(a==="adm-cfg-save"){
    if(!esDueno())return;
    const c={...STATE.admCfgEdit};
    if(c.pin&&!/^\d{4,8}$/.test(c.pin)){STATE.admCfgMsg="El PIN debe tener 4 a 8 dígitos.";R();return;}
    if(!/^\d{4,8}$/.test(c.pinDueno||"")){STATE.admCfgMsg="Tu PIN debe tener 4 a 8 dígitos.";R();return;}
    if(c.pin&&c.pin===c.pinDueno){STATE.admCfgMsg="Los dos PIN tienen que ser distintos.";R();return;}
    if(c.estado==="efectiva"&&STATE.admCfg.estado!=="efectiva")c.efectivaDesde=today();
    c.honorarioMensual=Number(c.honorarioMensual)||0;
    c.montoLimiteAprobacion=Number(c.montoLimiteAprobacion)||0;
    await saveAdmCfg(c);
    STATE.admCfgMsg="✓ Guardado";
  }
  R();
});

const admBind=(t,rerender)=>{
  const b=t.dataset.bind;if(!b)return;
  const[k,f,g]=b.split("."),val=t.type==="checkbox"?t.checked:t.value;
  if(k==="admPed"&&STATE.admPed)STATE.admPed[f]=val;
  else if(k==="admItem"&&STATE.admPed){STATE.admPed.items[Number(f)][g]=val;const el=document.getElementById("adm-ped-total");if(el)el.innerHTML=renderPedTotalTxt(STATE.admPed);}
  else if(k==="admRecep"&&STATE.admRecep)STATE.admRecep[f]=val;
  else if(k==="admRecepItem"&&STATE.admRecep)STATE.admRecep.recibidos[Number(f)]=val;
  else if(k==="admPago"&&STATE.admPago){
    STATE.admPago[f]=val;
    if(f==="proveedor"){STATE.admPago.pedidoId="";const pr=provByName(val);if(pr?.medioPagoHabitual)STATE.admPago.medioPago=pr.medioPagoHabitual;}
    if(f==="pedidoId"&&val){const p=facturasPendientes().find(x=>x.id===val);if(p){STATE.admPago.monto=String(p.debe);STATE.admPago.fechaProgramada=p.venc||today();}}
  }
  else if(k==="admProv"&&STATE.admProv)STATE.admProv[f]=val;
  else if(k==="admLog"&&STATE.admLog)STATE.admLog[f]=val;
  else if(k==="admCfgEdit"&&STATE.admCfgEdit)STATE.admCfgEdit[f]=val;
  else return;
  if(rerender)R();
};
document.addEventListener("input",e=>{if(e.target.tagName!=="SELECT"&&e.target.type!=="checkbox")admBind(e.target,false);});
document.addEventListener("change",e=>{if(e.target.tagName==="SELECT"||e.target.type==="checkbox")admBind(e.target,true);});

R();
</script>
</body>
